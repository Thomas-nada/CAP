name: CIS – Cardano Improvement Suggestion
description: Submit a new Cardano Improvement Suggestion for community deliberation.
title: "[CIS] "
labels: ["CIS", "submitted"]

body:
  - type: markdown
    attributes:
      value: |
        ## Cardano Improvement Suggestion (CIS)
        CIS proposals go directly to community deliberation. Complete all required fields.
        **Tip:** Use the [CAP Portal](https://thomas-nada.github.io/cap-tool/) for a guided submission experience.

  - type: dropdown
    id: category
    attributes:
      label: Proposal Category
      options:
        - Procedural – Governance procedures
        - Substantive – Constitutional substance
        - Technical – Technical or protocol changes
        - Interpretive – Clarifications of existing text
        - Editorial – Formatting or typo fixes
        - Other
    validations:
      required: true

  - type: textarea
    id: abstract
    attributes:
      label: Summary
      description: A concise summary of what this suggestion proposes (1–3 sentences).
      placeholder: This suggestion proposes that...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem
      description: What specific constitutional issue have you identified?
    validations:
      required: true

  - type: textarea
    id: analysis
    attributes:
      label: Context
      description: Background, circumstances, and detailed examination of the suggestion.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What are the expected consequences if this suggestion is adopted?
    validations:
      required: true

  - type: textarea
    id: exhibits
    attributes:
      label: Links and Files
      description: Supporting links, references, or file attachments (optional).
      placeholder: "https://..."

  - type: input
    id: coauthors
    attributes:
      label: Co-Authors
      description: GitHub usernames of co-authors (optional), comma-separated.
      placeholder: "@username1, @username2"
